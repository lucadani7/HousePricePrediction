[project]
name = "housepriceprediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lucadani7", email = "79052990+lucadani7@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas==3.1.1",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
train = "housepriceprediction.train:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
]
